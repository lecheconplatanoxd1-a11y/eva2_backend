{% extends "farmacia/base.html" %}

{% block title %}Pago - Farmacia{% endblock %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-md-7">

    <div class="card shadow-sm">

        <div class="card-body">

            <h1 class="mb-4">
                Pago de solicitud #{{ solicitud.id }}
            </h1>

            <p class="text-muted">
                La solicitud está pendiente de pago.
            </p>

            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}

            <h5 class="mb-3">
                Selecciona un método de pago
            </h5>

            <form method="post">

                {% csrf_token %}

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="metodo_pago"
                        value="TRANSFERENCIA"
                        id="transferencia"
                        required
                    >

                    <label
                        class="form-check-label"
                        for="transferencia"
                    >
                        Transferencia bancaria
                    </label>

                </div>

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="metodo_pago"
                        value="TARJETA"
                        id="tarjeta"
                    >

                    <label
                        class="form-check-label"
                        for="tarjeta"
                    >
                        Tarjeta de crédito/débito
                    </label>

                </div>

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="metodo_pago"
                        value="ORDEN_COMPRA"
                        id="orden_compra"
                    >

                    <label
                        class="form-check-label"
                        for="orden_compra"
                    >
                        Orden de compra institucional
                    </label>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    Realizar pago
                </button>

            </form>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
