{% extends "farmacia/base.html" %}

{% block title %}Iniciar sesión - Farmacia{% endblock %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-md-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Iniciar sesión
            </h2>

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Ingresar
                </button>

            </form>
            <div class="text-center mt-3">
    <a href="/registro/">
        ¿No tienes una cuenta? Crear cuenta
    </a>
</div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
